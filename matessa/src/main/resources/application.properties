spring.application.name=matessa

# --- Security & JWT ---
spring.security.user.name=anasha
spring.security.user.password=anas0101

# Use Env Variable for Secret (Safe), or fallback to default (Local)
spring.app.jwtSecret=${JWT_SECRET:MySuperSecretKeyForMatessaProjectThatIsVeryLongAndSecure2025}
spring.app.jwtExpirationMs=86400000
spring.ecom.jwtCookieName=jwtCookieEcom

# --- Database Configuration ---
# Logic: Use Dokploy variables if they exist. If not, use localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce?serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@nas09303Anas}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.main.lazy-initialization=true
spring.jackson.time-zone=Asia/Kolkata
# --- JPA / Hibernate ---
# 'update' automatically creates tables. Good for now.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
project.image=/app/images

# --- Logging (Reduced to INFO for better performance) ---
logging.level.org.springframework=INFO
logging.level.org.hibernate.sql=DEBUG
logging.level.com.ecommerce.matessa=DEBUG

fp.api.key=cde828c6eebf3b57191cec5e1cd03000

fp.account.id=xwt0cawz

# Optimization for Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
