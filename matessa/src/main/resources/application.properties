spring.application.name=matessa

# --- Security & JWT ---
spring.security.user.name=anasha
spring.security.user.password=anas0101

# Use Env Variable for Secret (Safe), or fallback to default (Local)
spring.app.jwtSecret=${JWT_SECRET:MySuperSecretKeyForMatessaProjectThatIsVeryLongAndSecure2025}
spring.app.jwtExpirationMs=86400000
spring.ecom.jwtCookieName=jwtCookieEcom

# --- Database Configuration ---
# Logic: Use Dokploy variables if they exist. If not, use localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@nas09303Anas}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' automatically creates tables. Good for now.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
project.image=images/

# --- Logging (Reduced to INFO for better performance) ---
logging.level.org.springframework=INFO
logging.level.org.hibernate.sql=DEBUG
logging.level.com.ecommerce.matessa=DEBUG