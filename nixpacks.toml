# 1. Setup Phase (UPDATED: Requesting Node 20)
[phases.setup]
nixPkgs = ["jdk", "maven", "nodejs-20_x"]

# 2. Build Frontend (Keep the fixes we added)
[phases.frontend]
cmds = ["cd client && npm install --legacy-peer-deps && CI=false npm run build"]

# 3. Copy React files to Java folder
[phases.copy_assets]
dependsOn = ["frontend"]
cmds = [
    "mkdir -p matessa/src/main/resources/static",
    "cp -r client/dist/* matessa/src/main/resources/static/"
]

# 4. Build Backend
[phases.build]
dependsOn = ["copy_assets"]
cmds = ["cd matessa && mvn clean package -DskipTests"]

# 5. Start Server
[start]
cmd = "java -jar matessa/target/*.jar"