# 1. Setup Phase (UPDATED: Changed to nodejs_22)
[phases.setup]
nixPkgs = ["jdk", "maven", "nodejs_22"]

# 2. Build Frontend (UPDATED: Added permission fix command)
[phases.frontend]
cmds = [
    "cd client && npm install --legacy-peer-deps",
    "chmod +x client/node_modules/.bin/vite", 
    "cd client && CI=false npm run build"
]

# 3. Copy React files to Java folder
[phases.copy_assets]
dependsOn = ["frontend"]
cmds = [
    "mkdir -p matessa/src/main/resources/static",
    "cp -r client/dist/* matessa/src/main/resources/static/"
]

# 4. Build Backend
[phases.build]
dependsOn = ["copy_assets"]
cmds = ["cd matessa && mvn clean package -DskipTests"]

# 5. Start Server
[start]
cmd = "java -jar matessa/target/*.jar"